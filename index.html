<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <p class="display"></p>

    <div class="calculator">


        
        <div class="number">
            <button class="num-btn">1</button>
            <button class="num-btn">2</button>
            <button class="num-btn">3</button>
            <button class="num-btn">4</button>
            <button class="num-btn">5</button>
            <button class="num-btn">6</button>
            <button class="num-btn">7</button>
            <button class="num-btn">8</button>
            <button class="num-btn">9</button>
            <button class="ac-btn">AC</button>
            <button class="num-btn">0</button>
            <button class="num-btn dot-btn">.</button>
            
            

        </div>

        <div class="operator">
            <button class="opt-btn">+</button>
            <button class="opt-btn">-</button>
            <button class="opt-btn">*</button>
            <button class="opt-btn">/</button>
            <button class="equal-btn">=</button>
        </div>

        


    </div>
    

    <script>
        const calculator = document.querySelector(".calculator");
        const display = document.querySelector(".display");
        const number = document.querySelector(".number");
        const operator = document.querySelector(".operator");
        const dotBtn = document.querySelector('.dot-btn');

        let num1 = null;
        let num2 = null;
        let result = null;
        let opt = '';
        let shouldResetDisplay = true;
        


        number.addEventListener('click', (e) => {
            if(e.target.classList.contains('num-btn')){

                if(shouldResetDisplay){
                    display.textContent = '';
                    shouldResetDisplay = false;
                    dotBtn.disabled = false;
                }

                display.textContent += e.target.textContent;
                updateDotBtn();

               
            }

            if(e.target.classList.contains('ac-btn')){
                display.textContent = '';
                shouldResetDisplay =false;
                dotBtn.disabled = false;
                num1 = null;
                num2 = null;
                opt = '';
                result = 0;
            }

            
        });

        operator.addEventListener('click', (e) => {
            if(e.target.classList.contains('opt-btn')){


                //when user press opt-btn, but not input new number
                if(shouldResetDisplay){
                    opt = e.target.textContent;

                }else if(num1 && opt){

                    num2 = toNumber(display.textContent);
                    num1 = operate(opt, num1, num2);

                    opt = e.target.textContent;


                    display.textContent = num1;


                    shouldResetDisplay = true;


                }else if(!num1 && !opt){

                    num1 = toNumber(display.textContent);

                    
                    opt = e.target.textContent;
                    
                    shouldResetDisplay = true;
                }




            }

            if(e.target.classList.contains('equal-btn')){
                if((num1 && opt && !shouldResetDisplay)){
                    
                    num2 = toNumber(display.textContent);

                    
                    num1 = operate(opt, num1, num2);
                    display.textContent = num1;
                    shouldResetDisplay =true;
                    num2 = null;
                    opt = '';
                }


            }                
        })


        function toNumber(str){
            let num = parseFloat(str);

            // NaN === NaN is always false,Because NaN is not equal anything,including itself 
            return isNaN(num) ? null : num;
            
            

        }

        function updateDotBtn() {
            dotBtn.disabled = display.textContent.includes('.');
        }



        function add(a, b){
            return a + b;
        }

        function subtract(a, b){
            
            return a - b;
        }

        function multiply(a, b){
            return a * b;
        }

        function divide(a, b){
            if(b === 0) return "Never divide by zero!";
            return a / b;
        }

        function operate(operator, num1, num2){
            switch(operator){

                case "+":
                    return add(num1, num2);
                case "-":
                    return subtract(num1, num2);
                case "*":
                    return multiply(num1, num2);
                case "/":
                    return divide(num1, num2);
                default:
                    return 0;
            }

        }
    </script>
</body>
</html>
