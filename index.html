<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <p class="display"></p>

    <div class="calculator">


        
        <div class="number">
            <button class="num-btn">1</button>
            <button class="num-btn">2</button>
            <button class="num-btn">3</button>
            <button class="num-btn">4</button>
            <button class="num-btn">5</button>
            <button class="num-btn">6</button>
            <button class="num-btn">7</button>
            <button class="num-btn">8</button>
            <button class="num-btn">9</button>
            <button class="ac-btn">AC</button>
            <button class="num-btn">0</button>
            <button class="num-btn">.</button>
            
            

        </div>

        <div class="operator">
            <button class="opt-btn">+</button>
            <button class="opt-btn">-</button>
            <button class="opt-btn">*</button>
            <button class="opt-btn">/</button>
            <button class="equal-btn">=</button>
        </div>

        


    </div>
    

    <script>
        const calculator = document.querySelector(".calculator");
        const display = document.querySelector(".display");
        const number = document.querySelector(".number");
        const operator = document.querySelector(".operator");

        let num1 = null;
        let num2 = null;
        let result = null;
        let opt = '';

        calculator.addEventListener('click', (e) => {
            if(e.target.classList.contains('num-btn')){
                display.textContent += e.target.textContent;

               
            }

            if(e.target.classList.contains('ac-btn')){
                display.textContent = '';
            }

            if(e.target.classList.contains('opt-btn')){

                if(!num1 && !num2 && !opt){
                num1 = +display.textContent;
                opt = e.target.textContent;
                display.textContent = '';
                }


            }

            if(e.target.classList.contains('equal-btn')){

                num2 = display.textContent;
                result = operate(opt, num1, num2);
                display.textContent = result;
            
            }
            
        });








        function add(a, b){
            return a + b;
        }

        function subtract(a, b){
            return a - b;
        }

        function multiply(a, b){
            return a * b;
        }

        function divide(a, b){
            return a / b;
        }

        function operate(operator, num1, num2){
            switch(operator){

                case "+":
                    return add(num1, num2);
                case "-":
                    return subtract(num1, num2);
                case "*":
                    return multiply(num1, num2);
                case "/":
                    return divide(num1, num2);
                default:
                    return 0;
            }

        }
    </script>
</body>
</html>
